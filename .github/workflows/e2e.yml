name: E2E (Playwright)

# The full e2e suite is too heavy for a dev machine under software WebGL —
# it runs here instead, sharded 4 ways. CI already retries each test once
# (playwright.config.ts), which absorbs the timing flakes seen locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  framework-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core-consumer/package-lock.json
            examples/scene-demo/package-lock.json
      - name: Install framework build tools (including Three.js)
        run: npm ci --workspace=packages/core --workspace=packages/narrative --workspace=packages/gameplay --workspace=packages/three --include-workspace-root=false
      - name: Build and verify the independent tarball consumer
        run: npm run framework:consumer
        env:
          FRAMEWORK_INSTALL_CHROMIUM: '1'
          FRAMEWORK_TARBALL_OUTPUT: ${{ runner.temp }}/waypoint-rpg-core-0.1.0.tgz
      - name: Build and verify the standalone narrative tarball consumer
        run: npm run framework:narrative-consumer:prepared
        env:
          NARRATIVE_TARBALL_OUTPUT: ${{ runner.temp }}/waypoint-rpg-narrative-0.1.0.tgz
      - name: Verify independent Three.js scene consumer
        run: npm run framework:scene-consumer:prepared
        env:
          FRAMEWORK_INSTALL_CHROMIUM: 'browser-only'
          FRAMEWORK_TARBALL_OUTPUT: ${{ runner.temp }}/waypoint-rpg-core-0.1.0.tgz
          NARRATIVE_TARBALL_OUTPUT: ${{ runner.temp }}/waypoint-rpg-narrative-0.1.0.tgz
      - name: Build and pack the independent gameplay package
        run: |
          npm run framework:gameplay:build
          npm pack --ignore-scripts --workspace=packages/gameplay --pack-destination "$RUNNER_TEMP"
      - name: Prepare runtime-only consumer installs before switching Node versions
        run: >-
          node scripts/check-framework-runtime.mjs --prepare
          "$RUNNER_TEMP/waypoint-rpg-core-0.1.0.tgz"
          "$RUNNER_TEMP/waypoint-rpg-narrative-0.1.0.tgz"
          "$RUNNER_TEMP/waypoint-rpg-gameplay-0.1.0.tgz"
          "$RUNNER_TEMP/framework-runtime-consumer"
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-rpg-package-tarballs
          path: |
            ${{ runner.temp }}/waypoint-rpg-core-0.1.0.tgz
            ${{ runner.temp }}/waypoint-rpg-narrative-0.1.0.tgz
            ${{ runner.temp }}/waypoint-rpg-gameplay-0.1.0.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
      - name: Verify only native ESM runtimes at the declared minimum
        run: node scripts/check-framework-runtime.mjs --probe "$RUNNER_TEMP/framework-runtime-consumer"
        env:
          FRAMEWORK_EXPECT_RUNTIME_NODE: 22.0.0

  garden-consumer-and-e2e:
    name: Garden independent consumer and gameplay E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked repository toolchain
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build installed-tarball consumer and run Garden gameplay E2E
        run: npm run framework:garden-consumer
        env:
          FRAMEWORK_INSTALL_CHROMIUM: browser-only
          FRAMEWORK_GARDEN_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/garden-playwright-diagnostics
      - name: Verify Garden development Strict Mode lifecycles and ending cues
        run: npm run sample:garden:e2e:dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: garden-playwright-diagnostics
          path: ${{ runner.temp }}/garden-playwright-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  mahalle-library-consumer:
    name: Mahalle installed-library consumer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked repository toolchain
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build and test the root game using installed framework archives
        run: npm run framework:mahalle-consumer
        env:
          FRAMEWORK_INSTALL_CHROMIUM: browser-only
          FRAMEWORK_MAHALLE_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/mahalle-consumer-diagnostics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mahalle-consumer-playwright-diagnostics
          path: ${{ runner.temp }}/mahalle-consumer-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium + system deps
        run: npx playwright install --with-deps chromium
      - name: Verify linked framework development
        if: matrix.shard == 1
        run: npm run framework:watch:check
      - name: Emoji font
        # Headless Linux renders emoji as tofu without this — a font gap,
        # not an app bug (docs/QA.md).
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - name: Build
        run: npm run build
        env:
          # Same variable the deploy build reads; unset is fine — the app
          # falls back to the built-in default endpoint.
          VITE_RESEARCH_API_URL: ${{ vars.VITE_RESEARCH_API_URL }}
      - name: Fetch the previous same-origin release baseline
        if: matrix.shard == 1 && github.event_name != 'workflow_dispatch'
        id: rollback-baseline
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASELINE='${{ github.event.pull_request.base.sha }}'
          else
            BASELINE='${{ github.event.before }}'
          fi
          git fetch --no-tags --depth=1 origin "$BASELINE"
          echo "sha=$BASELINE" >> "$GITHUB_OUTPUT"
      - name: Build the old and candidate same-origin releases
        if: matrix.shard == 1 && github.event_name != 'workflow_dispatch'
        run: npm run release:rollback:prepare -- "${{ steps.rollback-baseline.outputs.sha }}"
      - name: Verify save compatibility across upgrade and rollback
        if: matrix.shard == 1 && github.event_name != 'workflow_dispatch'
        run: npx playwright test e2e/release-rollback.spec.ts --project=landscape-mobile
        env:
          RUN_RELEASE_ROLLBACK: '1'
      - name: Playwright shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
