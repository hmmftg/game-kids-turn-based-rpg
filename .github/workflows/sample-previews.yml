name: Sample game screenshots

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/sample-previews.yml
      - e2e/sample-previews.preview.ts
      - playwright.previews.config.ts
      - scripts/sync-sample-gallery.mjs
      - examples/garden-adventure/**
      - examples/scene-demo/**
      - packages/core/**
      - packages/narrative/**
      - packages/gameplay/**
      - packages/three/**
      - tools/creator/src/model-import.mjs
      - scripts/import-model*.mjs
      - scripts/import-meshy-pilot*.mjs
      - scripts/meshy-pilot-*.mjs
      - scripts/validate-garden-assets*.mjs
      - scripts/check-framework-garden-consumer.mjs
      - scripts/check-framework-runtime.mjs
      - docs/MAHALLE-LIBRARY-ADOPTION.md
      - docs/FRAMEWORK-ROADMAP.md
      - docs/CREATING-A-SAMPLE-GAME.md
      - docs/previews/phase5/**
      - examples/scene-demo/README.md
      - README.md
      - package.json
      - tsconfig.node.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-game-previews
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Check repository formatting
        run: npm run format:check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install emoji font for headless screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - name: Build the actual Kids RPG application
        run: npm run build
      - name: Verify Garden against independently installed framework tarballs
        run: npm run framework:garden-consumer
        env:
          FRAMEWORK_INSTALL_CHROMIUM: browser-only
      - name: Capture real rendered scenes using Playwright
        run: npm run sample:previews
      - name: Build and capture the independent Blood Leaf demonstration
        run: npm run sample:scene:previews
      - name: Build and capture both Garden story outcomes
        run: npm run sample:garden:previews
      - name: Update README with the captured gallery
        run: npm run sample:gallery
      - name: Format and verify the generated README
        run: |
          npx prettier --write README.md
          npm run roadmap:check
      - name: Upload source-rendered PNGs and provenance for every merge
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waypoint-rpg-sample-games-source-previews
          path: |
            docs/previews/legacy-sample/*.png
            docs/previews/blood-leaf/**/*
            docs/previews/garden-adventure/**/*
            docs/previews/phase5/**/*
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare a review patch when automated PR creation is disabled
        id: fallback
        if: github.event_name != 'pull_request' && (github.ref != 'refs/heads/main' || vars.FRAMEWORK_ROADMAP_AUTOPR != 'true')
        run: |
          patch="$RUNNER_TEMP/sample-previews.patch"
          git add -N -- README.md docs/previews/legacy-sample docs/previews/blood-leaf docs/previews/garden-adventure docs/previews/phase5
          git diff --binary --full-index -- README.md docs/previews/legacy-sample docs/previews/blood-leaf docs/previews/garden-adventure docs/previews/phase5 > "$patch"
          if [ -s "$patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "patch=$patch" >> "$GITHUB_OUTPUT"
            {
              echo "## Sample screenshot documentation"
              echo
              echo "The production Chromium captures and README gallery were generated. Automated PR creation is disabled or this is not a main-branch merge, so the documentation patch is attached as an artifact for review. The workflow does not push to a protected branch."
              echo
              echo "If automatic documentation PRs are desired, set FRAMEWORK_ROADMAP_AUTOPR=true and enable GitHub Actions to create and approve pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No preview documentation changes were generated."
          fi
      - name: Upload preview documentation patch for maintainer review
        if: steps.fallback.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sample-previews-documentation-patch
          path: ${{ steps.fallback.outputs.patch }}
          if-no-files-found: error
      - name: Propose updated visual documentation for review
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.FRAMEWORK_ROADMAP_AUTOPR == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/legacy-sample-previews
          base: main
          add-paths: |
            README.md
            docs/previews/legacy-sample
            docs/previews/blood-leaf
            docs/previews/garden-adventure
            docs/previews/phase5
          commit-message: 'docs: refresh real sample game previews'
          title: 'docs: refresh playable sample screenshots'
          body: |
            These screenshots were captured by Chromium from the production-built
            Kids RPG, Blood Leaf scene demo, and Garden of Stories following a
            push/merge to main. The game previews are real rendered states, not
            AI-generated concepts or exact-pixel regression baselines.

            Review visual differences, Persian RTL, both Garden outcomes, and
            the Kids RPG draft-content policy before merging this documentation PR.

            Source: the workflow run linked under this pull request's checks.
          delete-branch: true
