<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello-world — framework example</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #dff2d8;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .scene {
        position: relative;
        width: min(90vw, 420px);
        aspect-ratio: 1;
        background: #bfe3b4;
        border-radius: 24px;
        display: grid;
        place-items: center;
      }
      .prop {
        font-size: 72px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 24px;
        line-height: 1;
      }
      .cheer {
        position: absolute;
        top: 16%;
        font-size: 40px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .scene[data-phase='celebrated'] .cheer {
        opacity: 1;
      }
      .count {
        position: absolute;
        bottom: 8px;
        right: 16px;
        font-size: 14px;
        color: #356;
      }
    </style>
  </head>
  <body>
    <div class="scene" data-phase="idle">
      <div class="cheer" aria-hidden="true">🎉</div>
      <button class="prop" data-testid="prop" aria-label="fountain">⛲</button>
      <div class="count" data-testid="count">0</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
